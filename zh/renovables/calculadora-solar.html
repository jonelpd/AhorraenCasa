<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>太阳能计算器 | AhorraEnCasa</title><meta name="description" content="估算光伏发电量、自发自用、余电、年度节省和简单回本周期。"><link rel="canonical" href="https://jonelpd.github.io/AhorraEnCasa/zh/renovables/calculadora-solar.html"><link rel="alternate" hreflang="es" href="https://jonelpd.github.io/AhorraEnCasa/renovables/calculadora-solar.html"><link rel="alternate" hreflang="en" href="https://jonelpd.github.io/AhorraEnCasa/en/renovables/calculadora-solar.html"><link rel="alternate" hreflang="hi" href="https://jonelpd.github.io/AhorraEnCasa/hi/renovables/calculadora-solar.html"><link rel="alternate" hreflang="zh-Hans" href="https://jonelpd.github.io/AhorraEnCasa/zh/renovables/calculadora-solar.html"><link rel="alternate" hreflang="x-default" href="https://jonelpd.github.io/AhorraEnCasa/renovables/calculadora-solar.html"><style>body{margin:0;background:#f7faf8;color:#17221b;font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:980px;margin:auto;padding:0 22px}header{background:#fff;border-bottom:1px solid #dce7df}.nav{min-height:68px;display:flex;justify-content:space-between;align-items:center}.nav a{color:#0f5132;font-weight:800;text-decoration:none}.hero{background:#e9f7ef;padding:48px 0}.hero h1{font-size:clamp(34px,6vw,54px)}.card{background:#fff;border:1px solid #dce7df;border-radius:18px;padding:25px;margin:22px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfdad2;border-radius:9px;font-size:16px}.btn{border:0;background:#157347;color:#fff;padding:12px 18px;border-radius:9px;font-weight:800;cursor:pointer}.btn.secondary{background:#e9f7ef;color:#0f5132}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f7faf8;border:1px solid #dce7df;border-radius:13px;padding:15px}.metric strong{display:block;font-size:22px;color:#0f5132}@media(max-width:700px){.grid,.results{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a href="../">AhorraEnCasa ⚡</a><a href="./">太阳能中心</a></div></header><section class="hero"><div class="wrap"><h1>太阳能计算器</h1><p>初步估算光伏发电、自发自用、余电以及年度节省。</p></div></section><main class="wrap"><div class="card"><div class="grid"><div class="field"><label>每月用电量（kWh）</label><input id="c" type="number" value="300" min="0"></div><div class="field"><label>电价（€/kWh）</label><input id="p" type="number" value=".20" min="0" step=".01"></div><div class="field"><label>光伏功率（kWp）</label><input id="k" type="number" value="3" min="0" step=".1"></div><div class="field"><label>每日等效日照小时</label><input id="s" type="number" value="4" min="0" step=".1"></div><div class="field"><label>直接自用比例（%）</label><input id="a" type="number" value="60" min="0" max="100"></div><div class="field"><label>余电估算价值（€/kWh）</label><input id="e" type="number" value=".07" min="0" step=".01"></div><div class="field"><label>安装成本（€）</label><input id="i" type="number" value="6000" min="0" step="100"></div></div><p><button class="btn" onclick="calc()">计算</button> <button class="btn secondary" onclick="location.reload()">重置</button></p></div><div id="out" class="card"></div><p><a href="./">← 太阳能中心</a></p></main><script>function n(id){return Math.max(0,parseFloat(document.getElementById(id).value)||0)}function euro(v){return v.toLocaleString("zh-CN",{style:"currency",currency:"EUR",maximumFractionDigits:0})}function calc(){let c=n("c")*12,p=n("p"),k=n("k"),s=n("s"),a=Math.min(100,n("a"))/100,e=n("e"),i=n("i"),prod=k*s*365,d=Math.min(prod*a,c),sur=Math.max(0,prod-d),save=d*p+sur*e,pay=save?i/save:null;document.getElementById("out").innerHTML='<h2>结果</h2><div class="results"><div class="metric"><strong>'+Math.round(prod)+' kWh</strong>年度太阳能发电</div><div class="metric"><strong>'+Math.round(d)+' kWh</strong>年度直接自用</div><div class="metric"><strong>'+Math.round(sur)+' kWh</strong>年度预计余电</div><div class="metric"><strong>'+euro(save)+'</strong>预计年度节省</div><div class="metric"><strong>'+euro(i)+'</strong>投资</div><div class="metric"><strong>'+(pay?pay.toFixed(1):"—")+' years</strong>简单回本周期</div></div>'}calc();</script></body></html>
