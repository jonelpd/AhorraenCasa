<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>我的账户 | AhorraEnCasaYa</title><link rel="icon" href="../assets/logo-mark-ahorraencasaya.svg"><link rel="stylesheet" href="../assets/premium-ui.css"><style>body{margin:0;background:#f7faf8;color:#17221b;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1050px;margin:auto;padding:0 20px}.top{padding:22px 0;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:#17221b;font-weight:900;font-size:22px}.brand img{width:40px}.brand span span{color:#157347}.btn{border:1px solid #dce7df;background:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.hero{padding:28px 0 12px}.hero p{color:#66736b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #dce7df;border-radius:18px;padding:22px;box-shadow:0 10px 28px #17351f0d}.card h3{margin-top:0}.metric{font-size:30px;font-weight:900;color:#157347}.muted{color:#66736b}.links a{display:block;color:#0f5132;font-weight:800;text-decoration:none;margin:10px 0}.wide{grid-column:1/-1}.bar{height:10px;border-radius:99px;background:#e7eee9;overflow:hidden}.bar i{display:block;height:100%;background:#157347;border-radius:99px;width:0}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start}.top .btn{white-space:nowrap}}</style></head><body><header><div class="wrap top"><a class="brand" href="../"><img src="../../assets/logo-mark-ahorraencasaya.svg" alt=""><span><span>Ahorra</span>EnCasaYa</span></a><button class="btn" id="logout">退出登录</button></div></header><main class="wrap hero"><p style="color:#157347;font-weight:900">我的账户</p><h1 id="welcome">你好</h1><p>你的个人空间，用于跟踪节省金额并保存计算器结果。</p><div class="account-email">当前账户： <strong id="accountEmail">—</strong></div><section class="grid"><article class="card"><h3>💰 累计节省</h3><div class="metric" id="total">0,00 €</div><div class="muted">手动记录</div><div class="links"><a href="ahorro.html">查看我的节省 →</a></div></article><article class="card"><h3>🧮 已保存结果</h3><div class="metric" id="calcCount">0</div><div class="muted">计算器结果</div><div class="links"><a href="ahorro.html">查看结果 →</a></div></article><article class="card"><h3>📈 最近一次节省</h3><div class="metric" id="lastAmount">0,00 €</div><div class="muted" id="lastMonth">暂无记录</div></article><article class="card wide"><h3>📊 近期变化</h3><p class="muted">比较你最近记录的月份。</p><div id="chart"></div></article><article class="card"><h3>👤 我的资料</h3><p class="muted">更新姓名并管理账户信息。</p><div class="links"><a href="perfil.html">编辑资料 →</a></div></article><article class="card"><h3>⚡ 工具</h3><div class="links"><a href="../calculadoras/">计算器 →</a><a href="../productos/comparativas.html">比较 →</a><a href="../guias/">指南 →</a></div></article><article class="card" id="premiumCard" hidden><h3>⭐ AhorraEnCasaYa Premium</h3><p class="muted" id="premiumText">Premium 会员专享内容、工具和资源。</p><div class="links"><a href="../../premium/">打开 Premium →</a></div></article><article class="card" id="adminCard" hidden><h3>👑 管理</h3><p class="muted">仅管理员可访问。</p><div class="links"><a href="../../admin/>打开管理面板 →</a></div></article></section></main><script src="../../assets/supabase-config.js"></script><script src="../../assets/auth.js"></script><script>const money=n=>Number(n||0).toLocaleString("es-ES",{style:"currency",currency:"EUR"}),monthLabel=v=>new Date(v+"T12:00:00").toLocaleDateString("zh-CN",{month:"short",year:"numeric"});(async()=>{try{const s=await AhorraAuth.requireSession("login.html");if(!s)return;const p=await AhorraAuth.getProfile(s);document.getElementById("welcome").textContent="你好, "+(p?.full_name||"");document.getElementById("accountEmail").textContent=s.user.email||"—";if(p?.role==="premium"||p?.role==="admin"){document.getElementById("premiumCard").hidden=false;if(p?.role==="admin")document.getElementById("premiumText").textContent="仅管理员可访问。"}if(p?.role==="admin")document.getElementById("adminCard").hidden=false;const c=await AhorraAuth.getClient(),uid=s.user.id;const [sr,cr]=await Promise.all([c.from("savings_records").select("month,amount").eq("user_id",uid).order("month",{ascending:false}).limit(24),c.from("calculator_results").select("id,calculator_name,month,monthly_saving,annual_saving,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(100)]);if(sr.error)throw sr.error;if(cr.error)throw cr.error;const savings=sr.data||[],calcs=cr.data||[];document.getElementById("total").textContent=money(savings.reduce((a,r)=>a+Number(r.amount||0),0));document.getElementById("calcCount").textContent=calcs.length;if(savings[0]){document.getElementById("lastAmount").textContent=money(savings[0].amount);document.getElementById("lastMonth").textContent=monthLabel(savings[0].month.slice(0,7))}const chart=document.getElementById("chart");if(!savings.length){chart.innerHTML='<p class="muted">你还没有记录节省金额。</p>'}else{const vals=[...savings].reverse().slice(-6),max=Math.max(...vals.map(x=>Number(x.amount)||0),1);chart.innerHTML=vals.map(r=>'<div style="display:grid;grid-template-columns:78px 1fr 90px;gap:10px;align-items:center;margin:10px 0"><small>'+monthLabel(r.month.slice(0,7))+'</small><div class="bar"><i style="width:'+Math.max(3,Math.round((Number(r.amount)||0)/max*100))+'%"></i></div><strong style="text-align:right">'+money(r.amount)+'</strong></div>').join("")}}catch(e){AhorraAuth.showError(e)}})();document.getElementById("logout").onclick=async()=>{try{const c=await AhorraAuth.getClient();await c.auth.signOut();location.href="../"}catch(e){AhorraAuth.showError(e)}};</script></body></html>
