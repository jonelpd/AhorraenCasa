<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>登录 | AhorraEnCasaYaYaYaYa</title><link rel="icon" href="../../../../../assets/logo-mark-ahorraencasaya.svg"><link rel="stylesheet" href="../../../../../assets/premium-ui.css"><style>body{margin:0;background:#f7faf8;color:#17221b;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}.box{max-width:460px;margin:8vh auto;padding:32px 24px;background:#fff;border:1px solid #dce7df;border-radius:22px;box-shadow:0 12px 35px #17351f12}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#17221b;font-weight:900;font-size:23px}.brand img{width:42px}.brand span span{color:#157347}.tabs{display:flex;gap:8px;margin:26px 0 18px}.tab{flex:1;padding:11px;border:1px solid #dce7df;background:#fff;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:#157347;color:#fff}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cddbd2;border-radius:10px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#157347;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:14px;padding:14px;border-radius:12px;background:#e9f7ef}.msg strong{display:block;margin-bottom:5px}.msg small{display:block;margin-top:5px;color:#526158}.resend{display:none;margin-top:10px}.resend button{border:0;background:none;padding:0;color:#0f5132;font:inherit;font-weight:900;text-decoration:underline;cursor:pointer}.err{background:#fff0f0;color:#8a1f1f}.back{display:inline-block;margin-top:20px;color:#0f5132;font-weight:800;text-decoration:none}.recover{margin:12px 0 0;text-align:right}.recover a{color:#0f5132;font-weight:800;text-decoration:none}</style></head><body><main class="box"><a class="brand" href="../../"><img src="../../../../../assets/logo-mark-ahorraencasaya.svg" alt=""><span><span>Ahorra</span>EnCasaYa</span></a><div class="tabs"><button class="tab active" id="loginTab" type="button">登录</button><button class="tab" id="signupTab" type="button">创建账户</button></div><form id="authForm"><div class="field"><label for="email">电子邮箱</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><div class="field" id="nameField" hidden><label for="name">姓名</label><input id="name" type="text" autocomplete="name"></div><button class="btn" id="submitBtn" type="submit">登录</button></form><p class="recover"><a href="recuperar.html">忘记密码？</a></p><p id="msg" class="msg" hidden></p><div id="resendBox" class="resend"><button type="button" id="resendBtn">重新发送确认邮件</button></div><a class="back" href="../../">← 返回 AhorraEnCasaYaYaYaYa</a></main><script src="../../../../../assets/supabase-config.js"></script><script src="../../../../../assets/auth.js"></script><script>
let mode="login",pendingEmail="";const form=document.getElementById("authForm"),msg=document.getElementById("msg"),nameField=document.getElementById("nameField"),btn=document.getElementById("submitBtn");function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function setMode(m){mode=m;document.getElementById("resendBox").style.display="none";document.getElementById("loginTab").classList.toggle("active",m==="login");document.getElementById("signupTab").classList.toggle("active",m==="signup");nameField.hidden=m!=="signup";btn.textContent=m==="login"?"登录":"创建账户";msg.hidden=true}const nextParam=new URLSearchParams(location.search).get("next");function safeNext(){if(!nextParam)return new URL("index.html",location.href).href;try{const u=new URL(nextParam,location.origin);return u.origin===location.origin?u.href:new URL("index.html",location.href).href}catch(e){return new URL("index.html",location.href).href}}
document.getElementById("resendBtn").onclick=async()=>{const b=document.getElementById("resendBtn");if(!pendingEmail)return;b.disabled=true;try{const c=await AhorraAuth.getClient();const r=await c.auth.resend({type:"signup",email:pendingEmail,options:{emailRedirectTo:"https://ahorraencasaya.es/cuenta/index.html"}});if(r.error)throw r.error;msg.innerHTML="<strong>✓ 邮件已重新发送</strong><small>我们再次发送了确认邮件。</small>";msg.className="msg";msg.hidden=false}catch(e){msg.textContent=e.message||"Error";msg.className="msg err";msg.hidden=false}finally{b.disabled=false}};
loginTab.onclick=()=>setMode("login");signupTab.onclick=()=>setMode("signup");form.onsubmit=async e=>{e.preventDefault();msg.hidden=true;btn.disabled=true;try{const c=await AhorraAuth.getClient(),email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(mode==="signup"){const name=document.getElementById("name").value.trim();const r=await c.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:"https://ahorraencasaya.es/cuenta/index.html"}});if(r.error)throw r.error;if(r.data.session){msg.innerHTML="<strong>✓ 账户已创建</strong><small>账户已激活，现在可以登录。</small>";msg.className="msg";msg.hidden=false;location.href=safeNext()}else{pendingEmail=email;msg.innerHTML="<strong>✓ 注册完成</strong><small>我们已向以下邮箱发送确认邮件： <strong>"+esc(email)+"</strong>. 请检查垃圾邮件或推广邮件，并在登录前确认邮箱。</small>";msg.className="msg";msg.hidden=false;document.getElementById("resendBox").style.display="block"}}else{const r=await c.auth.signInWithPassword({email,password});if(r.error)throw r.error;location.href=safeNext()}}catch(err){msg.textContent=err.message||"Error";msg.className="msg err";msg.hidden=false}finally{btn.disabled=false}};</script></body></html>
