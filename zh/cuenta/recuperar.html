<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>恢复密码 | AhorraEnCasaYa</title><link rel="icon" href="../../assets/logo-mark-ahorraencasaya.svg"><style>body{margin:0;background:#f7faf8;color:#17221b;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}.box{max-width:460px;margin:8vh auto;padding:32px 24px;background:#fff;border:1px solid #dce7df;border-radius:22px;box-shadow:0 12px 35px #17351f12}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#17221b;font-weight:900;font-size:23px}.brand img{width:42px}.brand span span{color:#157347}.field{margin:18px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cddbd2;border-radius:10px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#157347;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#e9f7ef}.err{background:#fff0f0;color:#8a1f1f}.back{display:inline-block;margin-top:20px;color:#0f5132;font-weight:800;text-decoration:none}</style></head><body><main class="box"><a class="brand" href="../../"><img src="../../assets/logo-mark-ahorraencasaya.svg" alt=""><span><span>Ahorra</span>EnCasaYa</span></a><h1>恢复密码</h1><p>输入邮箱，我们会发送创建新密码的链接。</p><form id="form"><div class="field"><label for="email">电子邮箱</label><input id="email" type="email" autocomplete="email" required></div><button class="btn" id="btn" type="submit">发送链接</button></form><p id="msg" class="msg" hidden></p><a class="back" href="login.html">← 返回登录</a></main><script src="../../assets/supabase-config.js"></script><script src="../../assets/auth.js"></script><script>const form=document.getElementById("form"),btn=document.getElementById("btn"),msg=document.getElementById("msg");form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;msg.hidden=true;try{const c=await AhorraAuth.getClient(),email=document.getElementById("email").value.trim();const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo:"https://ahorraencasaya.es/cuenta/restablecer.html"});if(error)throw error;msg.className="msg";msg.textContent="如果该邮箱对应一个账户，你将收到密码重置链接。";msg.hidden=false;form.reset()}catch(err){msg.className="msg err";msg.textContent=err.message||"Error";msg.hidden=false}finally{btn.disabled=false}};</script></body></html>
