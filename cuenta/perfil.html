<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mi perfil | AhorraEnCasaYa</title>
<link rel="icon" href="../assets/logo-mark-ahorraencasaya.svg">
<style>
body{margin:0;background:#f7faf8;color:#17221b;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}
.wrap{max-width:760px;margin:auto;padding:0 20px}.top{padding:22px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:#17221b;font-weight:900;font-size:22px}.brand img{width:40px}.brand span span{color:#157347}
.card{background:#fff;border:1px solid #dce7df;border-radius:18px;padding:26px;margin:20px 0;box-shadow:0 10px 28px #17351f0d}
label{display:block;font-weight:800;margin:15px 0 7px}input{width:100%;box-sizing:border-box;border:1px solid #ccd9d0;border-radius:10px;padding:12px;font:inherit}
button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#157347;color:#fff}.secondary{background:#fff;color:#0f5132;border:1px solid #cfdcd3}
.notice{margin:15px 0;padding:12px 14px;border-radius:10px;background:#f1f7f3}.error{background:#fff1f1;color:#9b2727}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}small{color:#66736b}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="../"><img src="../assets/logo-mark-ahorraencasaya.svg" alt=""><span><span>Ahorra</span>EnCasaYa</span></a><a href="./">Mi cuenta →</a></div></header>
<main class="wrap">
<section class="card">
<p style="color:#157347;font-weight:900">Mi perfil</p>
<h1>Datos personales</h1>
<p><small>El correo de acceso se mantiene en tu cuenta de autenticación. Aquí puedes actualizar tu nombre.</small></p>
<div id="message" class="notice" hidden></div>
<label for="name">Nombre</label>
<input id="name" maxlength="80" autocomplete="name" placeholder="Tu nombre">
<label>Correo electrónico</label>
<input id="email" disabled>
<div class="actions"><button id="save">Guardar cambios</button><a class="secondary" style="text-decoration:none;padding:11px 16px;border-radius:10px;font-weight:800" href="./">Cancelar</a></div>
</section>
<section class="card">
<h2>Seguridad</h2>
<p>Para cambiar tu contraseña utilizaremos el flujo seguro de recuperación de Supabase.</p>
<a href="login.html#recuperar" style="color:#0f5132;font-weight:800">Ir a recuperación de contraseña →</a>
</section>
</main>
<script src="../assets/supabase-config.js"></script><script src="../assets/auth.js"></script>
<script>
const msg=document.getElementById("message");
function show(text,error=false){msg.hidden=false;msg.className="notice"+(error?" error":"");msg.textContent=text}
(async()=>{
 try{
  const s=await AhorraAuth.requireSession("login.html"); if(!s)return;
  const p=await AhorraAuth.getProfile(s);
  document.getElementById("name").value=p?.full_name||s.user.user_metadata?.full_name||"";
  document.getElementById("email").value=s.user.email||"";
  document.getElementById("save").onclick=async()=>{
   const name=document.getElementById("name").value.trim();
   if(name.length<2||name.length>80){show("El nombre debe tener entre 2 y 80 caracteres.",true);return}
   const c=await AhorraAuth.getClient();
   const {error}=await c.rpc("update_my_profile",{new_full_name:name});
   if(error){show(error.message||"No se pudo guardar.",true);return}
   await c.auth.updateUser({data:{full_name:name}});
   show("Perfil actualizado correctamente.");
  };
 }catch(e){show(e.message||"No se pudo cargar el perfil.",true)}
})();
</script>
</body></html>
