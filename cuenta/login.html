<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acceder | AhorraEnCasaYaYa</title><link rel="icon" href="../assets/logo-mark-ahorraencasaya.svg"><link rel="stylesheet" href="../assets/premium-ui.css"><style>body{margin:0;background:#f7faf8;color:#17221b;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}.box{max-width:460px;margin:8vh auto;padding:32px 24px;background:#fff;border:1px solid #dce7df;border-radius:22px;box-shadow:0 12px 35px #17351f12}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#17221b;font-weight:900;font-size:23px}.brand img{width:42px}.brand span span{color:#157347}.tabs{display:flex;gap:8px;margin:26px 0 18px}.tab{flex:1;padding:11px;border:1px solid #dce7df;background:#fff;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:#157347;color:#fff}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cddbd2;border-radius:10px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#157347;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.msg{margin-top:14px;padding:14px;border-radius:12px;background:#e9f7ef}.msg strong{display:block;margin-bottom:5px}.msg small{display:block;margin-top:5px;color:#526158}.resend{display:none;margin-top:10px}.resend button{border:0;background:none;padding:0;color:#0f5132;font:inherit;font-weight:900;text-decoration:underline;cursor:pointer}.err{background:#fff0f0;color:#8a1f1f}.back{display:inline-block;margin-top:20px;color:#0f5132;font-weight:800;text-decoration:none}.recover{margin:12px 0 0;text-align:right}.recover a{color:#0f5132;font-weight:800;text-decoration:none}</style></head><body><main class="box"><a class="brand" href="../"><img src="../assets/logo-mark-ahorraencasaya.svg" alt=""><span><span>Ahorra</span>EnCasaYa</span></a><div class="tabs"><button class="tab active" id="loginTab" type="button">Acceder</button><button class="tab" id="signupTab" type="button">Crear cuenta</button></div><form id="authForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div><div class="field" id="nameField" hidden><label for="name">Nombre</label><input id="name" type="text" autocomplete="name"></div><button class="btn" id="submitBtn" type="submit">Acceder</button></form><p class="recover"><a href="recuperar.html">¿Has olvidado tu contraseña?</a></p><p id="msg" class="msg" hidden></p><div id="resendBox" class="resend"><button type="button" id="resendBtn">Reenviar correo de confirmación</button></div><a class="back" href="../">← Volver a AhorraEnCasaYaYa</a></main><script src="../assets/supabase-config.js"></script><script src="../assets/auth.js"></script><script>
let mode="login";let pendingEmail="";const form=document.getElementById("authForm"),msg=document.getElementById("msg"),nameField=document.getElementById("nameField"),btn=document.getElementById("submitBtn");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#039;"}[m]))}function setMode(m){mode=m;document.getElementById("resendBox").style.display="none";document.getElementById("loginTab").classList.toggle("active",m==="login");document.getElementById("signupTab").classList.toggle("active",m==="signup");nameField.hidden=m!=="signup";btn.textContent=m==="login"?"Acceder":"Crear cuenta";msg.hidden=true}
const nextParam=new URLSearchParams(location.search).get("next");const initialMode=new URLSearchParams(location.search).get("mode");if(initialMode==="signup")setMode("signup");
function safeNext(){if(!nextParam)return new URL("index.html",location.href).href;try{const u=new URL(nextParam,location.origin);return u.origin===location.origin?u.href:new URL("index.html",location.href).href}catch(e){return new URL("index.html",location.href).href}}
document.getElementById("resendBtn").onclick=async()=>{const b=document.getElementById("resendBtn");if(!pendingEmail)return;b.disabled=true;try{const c=await AhorraAuth.getClient();const r=await c.auth.resend({type:"signup",email:pendingEmail,options:{emailRedirectTo:"https://ahorraencasaya.es/cuenta/index.html"}});if(r.error)throw r.error;msg.innerHTML="<strong>✓ Correo reenviado</strong><small>Hemos enviado de nuevo el correo de confirmación.</small>";msg.className="msg";}catch(e){msg.textContent=e.message||"No se pudo reenviar el correo.";msg.className="msg err";}finally{b.disabled=false}};
loginTab.onclick=()=>setMode("login");signupTab.onclick=()=>setMode("signup");
form.onsubmit=async e=>{e.preventDefault();msg.hidden=true;btn.disabled=true;try{const c=await AhorraAuth.getClient();const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(mode==="signup"){const name=document.getElementById("name").value.trim();const r=await c.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:"https://ahorraencasaya.es/cuenta/index.html"}});if(r.error)throw r.error;if(r.data.session){msg.innerHTML="<strong>✓ Cuenta creada</strong><small>Tu cuenta está activa y ya puedes entrar.</small>";msg.className="msg";msg.hidden=false;location.href=safeNext()}else{pendingEmail=email;msg.innerHTML="<strong>✓ Registro completado</strong><small>Hemos enviado un correo de confirmación a <strong>"+esc(email)+"</strong>. Revisa también Spam o Promociones y confirma tu email antes de acceder.</small>";msg.className="msg";msg.hidden=false;document.getElementById("resendBox").style.display="block";}}else{const r=await c.auth.signInWithPassword({email,password});if(r.error)throw r.error;location.href=safeNext()}}catch(err){msg.textContent=err.message||"No se pudo completar la operación.";msg.className="msg err";msg.hidden=false}finally{btn.disabled=false}};
</script></body></html>
