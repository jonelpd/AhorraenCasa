name: Revisar catálogo Amazon

on:
  workflow_dispatch:
  schedule:
    # Revisión diaria del catálogo. No se guardan historiales de precios.
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: amazon-catalog-refresh
  cancel-in-progress: false

jobs:
  update-amazon:
    runs-on: ubuntu-latest
    env:
      AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
      AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG || 'jonelpd-21' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip requests

      - name: Consultar Amazon Creators API
        run: |
          if [ -z "$AMAZON_CLIENT_ID" ] || [ -z "$AMAZON_CLIENT_SECRET" ]; then
            echo "::warning::Faltan las credenciales de Amazon Creators API. Se mantiene el catálogo existente y no se muestran precios históricos."
            touch .amazon-skip
            exit 0
          fi
          python scripts/amazon_update.py

      - name: Publicar catálogo actualizado
        run: |
          if [ -f .amazon-skip ]; then
            exit 0
          fi
          git config user.name "AhorraEnCasaYa Amazon Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon-products-live.json
          git diff --cached --quiet || git commit -m "Revisar catálogo Amazon"
          git push
