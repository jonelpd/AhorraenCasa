name: Actualizar precios Amazon

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  update-amazon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip requests
      - name: Consultar Amazon Creators API
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: python scripts/amazon_update.py
      - name: Publicar datos actualizados
        run: |
          git config user.name "AhorraEnCasa Amazon Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon-products-live.json
          git diff --cached --quiet || git commit -m "Actualizar precios Amazon"
          git push
