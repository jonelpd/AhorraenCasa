name: Revisar catálogo Amazon

on:
  workflow_dispatch:
  schedule:
    # Revisión diaria del catálogo. No se guardan historiales de precios.
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: amazon-catalog-refresh
  cancel-in-progress: false

jobs:
  update-amazon:
    if: ${{ secrets.AMAZON_CLIENT_ID != '' && secrets.AMAZON_CLIENT_SECRET != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip requests

      - name: Consultar Amazon Creators API
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG || 'jonelpd-21' }}
        run: python scripts/amazon_update.py

      - name: Publicar catálogo actualizado
        run: |
          git config user.name "AhorraEnCasaYa Amazon Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon-products-live.json
          git diff --cached --quiet || git commit -m "Revisar catálogo Amazon"
          git push

  credentials-check:
    if: ${{ secrets.AMAZON_CLIENT_ID == '' || secrets.AMAZON_CLIENT_SECRET == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Estado de la integración
        run: |
          echo "::warning::La actualización automática de productos Amazon está preparada pero faltan las credenciales de Creators API en GitHub Secrets."
          echo "Añade AMAZON_CLIENT_ID y AMAZON_CLIENT_SECRET para activar la consulta periódica."
