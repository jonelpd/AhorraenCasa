name: Migrate SEO URLs to ahorraencasaya.es

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Replace old public URL with custom domain
        shell: python
        run: |
          from pathlib import Path

          OLD = "https://jonelpd.github.io/AhorraenCasa"
          NEW = "https://ahorraencasaya.es"

          changed = []
          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              if p.suffix.lower() not in {".html", ".xml", ".txt"}:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              new_text = text.replace(OLD, NEW)
              if new_text != text:
                  p.write_text(new_text, encoding="utf-8")
                  changed.append(str(p))

          print(f"Updated {len(changed)} files")
          for p in changed:
              print(p)

      - name: Commit SEO migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Migrate SEO URLs to ahorraencasaya.es"
          git push
