name: Apply AdSense to all site pages

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "assets/adsense.js"
      - "assets/adsense-config.js"
      - ".github/workflows/apply-adsense.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add AdSense loader to HTML pages
        shell: python
        run: |
          from pathlib import Path

          config_name = "assets/adsense-config.js"
          loader_name = "assets/adsense.js"
          changed = []

          for p in Path(".").rglob("*.html"):
              if ".git" in p.parts:
                  continue
              if p.name == "404.html" or p.as_posix().startswith("admin/"):
                  continue

              text = p.read_text(encoding="utf-8")
              if loader_name in text:
                  continue
              if "</head>" not in text.lower():
                  continue

              depth = len(p.parent.parts)
              prefix = "../" * depth
              block = (
                  f'\n<script src="{prefix}{config_name}"></script>'
                  f'\n<script src="{prefix}{loader_name}"></script>\n'
              )
              text = text.replace("</head>", block + "</head>", 1)
              p.write_text(text, encoding="utf-8")
              changed.append(p.as_posix())

          print(f"Updated {len(changed)} HTML files")
          for name in changed:
              print(name)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Configure AdSense across site pages"
          git push
