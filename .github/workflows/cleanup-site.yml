name: One-time site cleanup

on:
  push:
    paths:
      - "**.html"
      - ".github/workflows/cleanup-site.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Normalize public brand and localized account paths
        shell: python
        run: |
          from pathlib import Path
          for p in Path(".").rglob("*.html"):
              if ".git" in p.parts:
                  continue
              s=p.read_text(encoding="utf-8", errors="replace")
              s=s.replace("AhorraEnCasa", "AhorraEnCasaYa")
              if len(p.parts) >= 2 and p.parts[-2] == "cuenta" and p.parts[0] in {"en","hi","zh"}:
                  s=s.replace("../assets/", "../../assets/")
                  s=s.replace("../calculadoras/", "../../calculadoras/")
                  s=s.replace("../productos/", "../../productos/")
                  s=s.replace("../guias/", "../../guias/")
                  s=s.replace('href="../../admin/>', 'href="../../admin/">')
              p.write_text(s, encoding="utf-8")
      - name: Commit cleanup
        run: |
          git config user.name "AhorraEnCasaYa Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.html" "*/**/*.html"
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Corregir marca y rutas localizadas [skip ci]"
          git push
