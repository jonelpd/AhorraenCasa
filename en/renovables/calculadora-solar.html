<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar calculator | AhorraEnCasa</title><meta name="description" content="Estimate solar production, self-consumption, surplus, annual savings and simple payback."><link rel="canonical" href="https://jonelpd.github.io/AhorraEnCasa/en/renovables/calculadora-solar.html"><link rel="alternate" hreflang="es" href="https://jonelpd.github.io/AhorraEnCasa/renovables/calculadora-solar.html"><link rel="alternate" hreflang="en" href="https://jonelpd.github.io/AhorraEnCasa/en/renovables/calculadora-solar.html"><link rel="alternate" hreflang="hi" href="https://jonelpd.github.io/AhorraEnCasa/hi/renovables/calculadora-solar.html"><link rel="alternate" hreflang="zh-Hans" href="https://jonelpd.github.io/AhorraEnCasa/zh/renovables/calculadora-solar.html"><link rel="alternate" hreflang="x-default" href="https://jonelpd.github.io/AhorraEnCasa/renovables/calculadora-solar.html"><style>body{margin:0;background:#f7faf8;color:#17221b;font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:980px;margin:auto;padding:0 22px}header{background:#fff;border-bottom:1px solid #dce7df}.nav{min-height:68px;display:flex;justify-content:space-between;align-items:center}.nav a{color:#0f5132;font-weight:800;text-decoration:none}.hero{background:#e9f7ef;padding:48px 0}.hero h1{font-size:clamp(34px,6vw,54px)}.card{background:#fff;border:1px solid #dce7df;border-radius:18px;padding:25px;margin:22px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfdad2;border-radius:9px;font-size:16px}.btn{border:0;background:#157347;color:#fff;padding:12px 18px;border-radius:9px;font-weight:800;cursor:pointer}.btn.secondary{background:#e9f7ef;color:#0f5132}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f7faf8;border:1px solid #dce7df;border-radius:13px;padding:15px}.metric strong{display:block;font-size:22px;color:#0f5132}@media(max-width:700px){.grid,.results{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a href="../">AhorraEnCasa ⚡</a><a href="./">Solar Center</a></div></header><section class="hero"><div class="wrap"><h1>Solar calculator</h1><p>Make a first estimate of photovoltaic production, direct self-consumption, surplus and annual savings.</p></div></section><main class="wrap"><div class="card"><div class="grid"><div class="field"><label>Monthly electricity use (kWh)</label><input id="c" type="number" value="300" min="0"></div><div class="field"><label>Energy price (€/kWh)</label><input id="p" type="number" value=".20" min="0" step=".01"></div><div class="field"><label>PV power (kWp)</label><input id="k" type="number" value="3" min="0" step=".1"></div><div class="field"><label>Equivalent sun hours/day</label><input id="s" type="number" value="4" min="0" step=".1"></div><div class="field"><label>Direct self-consumption (%)</label><input id="a" type="number" value="60" min="0" max="100"></div><div class="field"><label>Estimated surplus value (€/kWh)</label><input id="e" type="number" value=".07" min="0" step=".01"></div><div class="field"><label>Installation cost (€)</label><input id="i" type="number" value="6000" min="0" step="100"></div></div><p><button class="btn" onclick="calc()">Calculate</button> <button class="btn secondary" onclick="location.reload()">Reset</button></p></div><div id="out" class="card"></div><p><a href="./">← Solar Center</a></p></main><script>function n(id){return Math.max(0,parseFloat(document.getElementById(id).value)||0)}function euro(v){return v.toLocaleString("en-US",{style:"currency",currency:"EUR",maximumFractionDigits:0})}function calc(){let c=n("c")*12,p=n("p"),k=n("k"),s=n("s"),a=Math.min(100,n("a"))/100,e=n("e"),i=n("i"),prod=k*s*365,d=Math.min(prod*a,c),sur=Math.max(0,prod-d),save=d*p+sur*e,pay=save?i/save:null;document.getElementById("out").innerHTML='<h2>Result</h2><div class="results"><div class="metric"><strong>'+Math.round(prod)+' kWh</strong>Solar production/year</div><div class="metric"><strong>'+Math.round(d)+' kWh</strong>Direct solar use/year</div><div class="metric"><strong>'+Math.round(sur)+' kWh</strong>Estimated surplus/year</div><div class="metric"><strong>'+euro(save)+'</strong>Estimated annual saving</div><div class="metric"><strong>'+euro(i)+'</strong>Investment</div><div class="metric"><strong>'+(pay?pay.toFixed(1):"—")+' years</strong>Simple payback</div></div>'}calc();</script></body></html>
