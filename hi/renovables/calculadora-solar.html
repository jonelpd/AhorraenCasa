</head><body><header><div class="wrap nav"><a href="../">AhorraenCasa ⚡</a><a href="./">सोलर सेंटर</a></div></header><section class="hero"><div class="wrap"><h1>सौर कैलकुलेटर</h1><p>फोटोवोल्टिक उत्पादन, प्रत्यक्ष स्व-उपयोग, अतिरिक्त ऊर्जा और वार्षिक बचत का प्रारंभिक अनुमान लगाएँ।</p></div></section><main class="wrap"><div class="card"><div class="grid"><div class="field"><label>मासिक बिजली खपत (kWh)</label><input id="c" type="number" value="300" min="0"></div><div class="field"><label>ऊर्जा कीमत (€/kWh)</label><input id="p" type="number" value=".20" min="0" step=".01"></div><div class="field"><label>सौर क्षमता (kWp)</label><input id="k" type="number" value="3" min="0" step=".1"></div><div class="field"><label>प्रति दिन समतुल्य धूप घंटे</label><input id="s" type="number" value="4" min="0" step=".1"></div><div class="field"><label>प्रत्यक्ष स्व-उपयोग (%)</label><input id="a" type="number" value="60" min="0" max="100"></div><div class="field"><label>अतिरिक्त ऊर्जा का अनुमानित मूल्य (€/kWh)</label><input id="e" type="number" value=".07" min="0" step=".01"></div><div class="field"><label>स्थापना लागत (€)</label><input id="i" type="number" value="6000" min="0" step="100"></div></div><p><button class="btn" onclick="calc()">गणना करें</button> <button class="btn secondary" onclick="location.reload()">रीसेट</button></p></div><div id="out" class="card"></div><p><a href="./">← सोलर सेंटर</a></p></main><script>function n(id){return Math.max(0,parseFloat(document.getElementById(id).value)||0)}function euro(v){return v.toLocaleString("hi-IN",{style:"currency",currency:"EUR",maximumFractionDigits:0})}function calc(){let c=n("c")*12,p=n("p"),k=n("k"),s=n("s"),a=Math.min(100,n("a"))/100,e=n("e"),i=n("i"),prod=k*s*365,d=Math.min(prod*a,c),sur=Math.max(0,prod-d),save=d*p+sur*e,pay=save?i/save:null;document.getElementById("out").innerHTML='<h2>परिणाम</h2><div class="results"><div class="metric"><strong>'+Math.round(prod)+' kWh</strong>वार्षिक सौर उत्पादन</div><div class="metric"><strong>'+Math.round(d)+' kWh</strong>प्रत्यक्ष सौर उपयोग</div><div class="metric"><strong>'+Math.round(sur)+' kWh</strong>अनुमानित अतिरिक्त ऊर्जा</div><div class="metric"><strong>'+euro(save)+'</strong>अनुमानित वार्षिक बचत</div><div class="metric"><strong>'+euro(i)+'</strong>निवेश</div><div class="metric"><strong>'+(pay?pay.toFixed(1):"—")+' years</strong>सरल वापसी अवधि</div></div>'}calc();</script></body></html>
