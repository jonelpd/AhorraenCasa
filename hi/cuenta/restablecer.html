<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>नया पासवर्ड | AhorraEnCasaYa</title><link rel="icon" href="../../assets/logo-mark-ahorraencasaya.svg"><style>body{margin:0;background:#f7faf8;color:#17221b;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}.box{max-width:460px;margin:8vh auto;padding:32px 24px;background:#fff;border:1px solid #dce7df;border-radius:22px;box-shadow:0 12px 35px #17351f12}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#17221b;font-weight:900;font-size:23px}.brand img{width:42px}.brand span span{color:#157347}.field{margin:18px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cddbd2;border-radius:10px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#157347;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#e9f7ef}.err{background:#fff0f0;color:#8a1f1f}.back{display:inline-block;margin-top:20px;color:#0f5132;font-weight:800;text-decoration:none}</style></head><body><main class="box"><a class="brand" href="../../"><img src="../../assets/logo-mark-ahorraencasaya.svg" alt=""><span><span>Ahorra</span>EnCasaYa</span></a><h1>नया पासवर्ड</h1><p>अपने खाते के लिए नया पासवर्ड चुनें।</p><form id="form"><div class="field"><label for="password">नया पासवर्ड</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirm">पासवर्ड दोहराएं</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn" id="btn" type="submit">नया पासवर्ड सहेजें</button></form><p id="msg" class="msg" hidden></p><a class="back" href="login.html">← लॉग इन पर वापस जाएं</a></main><script src="../../assets/supabase-config.js"></script><script src="../../assets/auth.js"></script><script>const form=document.getElementById("form"),btn=document.getElementById("btn"),msg=document.getElementById("msg");let recovery=false;function show(t,e=false){msg.hidden=false;msg.className="msg"+(e?" err":"");msg.textContent=t}(async()=>{try{const c=await AhorraAuth.getClient();c.auth.onAuthStateChange(event=>{if(event==="PASSWORD_RECOVERY")recovery=true});const {data:{session}}=await c.auth.getSession();if(session)recovery=true;setTimeout(()=>{if(!recovery)show("Open this page from the recovery link you received by email.",true)},1200)}catch(e){show(e.message||"Error",true)}})();form.onsubmit=async e=>{e.preventDefault();const p=document.getElementById("password").value,c=document.getElementById("confirm").value;if(p.length<8){show("Password must contain at least 8 characters.",true);return}if(p!==c){show("Passwords do not match.",true);return}btn.disabled=true;try{const client=await AhorraAuth.getClient(),{error}=await client.auth.updateUser({password:p});if(error)throw error;show("पासवर्ड सफलतापूर्वक अपडेट हो गया। अब आप लॉग इन कर सकते हैं।");setTimeout(()=>location.href="login.html",1800)}catch(err){show(err.message||"Error",true)}finally{btn.disabled=false}};</script></body></html>
