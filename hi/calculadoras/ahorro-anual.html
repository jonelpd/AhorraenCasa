</head><body><main class="wrap"><a class="back" href="../">← बचत केंद्र पर वापस जाएँ</a>
<div class="card"><p>⚡ निःशुल्क टूल</p><h1>वार्षिक बिजली बचत कैलकुलेटर</h1>
<p>वर्तमान वार्षिक लागत की तुलना कम दैनिक उपयोग वाले अनुमान से करें।</p>
<div class="grid">
<div class="field"><label for="w">उपकरण की शक्ति (W)</label><input id="w" type="number" min="1" value="1000"></div>
<div class="field"><label for="h1">वर्तमान घंटे प्रति दिन</label><input id="h1" type="number" min="0" step=".1" value="4"></div>
<div class="field"><label for="h2">लक्ष्य घंटे प्रति दिन</label><input id="h2" type="number" min="0" step=".1" value="3"></div>
<div class="field"><label for="p">बिजली की कीमत (€/kWh)</label><input id="p" type="number" min="0" step=".01" value=".18"></div>
</div>
<div class="result">वर्तमान वार्षिक लागत: <strong id="a">€0.00</strong><br>लक्ष्य वार्षिक लागत: <strong id="b">€0.00</strong><br>अनुमानित बचत: <strong id="s">€0.00</strong></div>
<p><small>अनुमान: शक्ति × घंटे × 365 × कीमत। वास्तविक बिल में अन्य शुल्क शामिल हो सकते हैं।</small></p>
</div></main>
<script>
const ids=["w","h1","h2","p"];ids.forEach(id=>document.getElementById(id).addEventListener("input",calc));
function euro(n){return new Intl.NumberFormat("hi-IN",{style:"currency",currency:"EUR"}).format(n)}
function calc(){const w=+document.getElementById("w").value||0,h1=+document.getElementById("h1").value||0,h2=+document.getElementById("h2").value||0,p=+document.getElementById("p").value||0;const a=w/1000*h1*365*p,b=w/1000*h2*365*p;document.getElementById("a").textContent=euro(a);document.getElementById("b").textContent=euro(b);document.getElementById("s").textContent=euro(Math.max(0,a-b))}
calc();
</script></body></html>
